[build]
  publish = "public"
  command = "npm run typecheck"

[functions]
  node_bundler = "esbuild"

# Old URLs -> the standard /{game}, /{game} and /{game}/{date} structure (permanent)
[[redirects]]
  from = "/sudoku-daily-result"
  to = "/sudoku-game-answers"
  status = 301
[[redirects]]
  from = "/sudoku-daily-result/*"
  to = "/sudoku-game-answers/:splat"
  status = 301
